<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Three — RAJ SR</title>
</head>

<body>

    <h1>Create your account</h1>
    <p>Join us in a couple of steps.</p>

    <form>

        <div class="S">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
        </div>

        <div class="S">
            <label for="age">Age</label>
            <input type="number" id="age" name="phonenumber" placeholder="28" required>
        </div>

        <div class="S">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" placeholder="25/06/2026" required>
        </div>

        <div class="S">
            <label for="email">Email address </label>
            <input type="email" id="email" name="email" placeholder="jane@company.com" required>
        </div>

        <div class="S">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="***********">
        </div>

        <div class="R">
            <label>Preferred Contact</label>
            <input type="radio" name="contact"> Email
            <input type="radio" name="contact"> Phone
            <input type="radio" name="contact"> SMS
        </div>

        <div class="B">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>

</html>
