
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Info — RAJ SR</title>
</head>

<body>
  <!--<hr>-->

  <h1>Donor Information</h1>
  <p>Fill out the form below.</p>

  <form action="#" method="post">

    <!--<fieldset>-->
      <legend>Donor Form</legend>

      <table>
        <tr>
          <td><label for="firstName">First Name:*</label></td>
          <td><input type="text" id="firstName" name="firstName" required></td>
        </tr>
        <tr>
          <td><label for="lastName">Last Name:*</label></td>
          <td><input type="text" id="lastName" name="lastName" required></td>
        </tr>
        <tr>
          <td><label for="Company">Company:</label></td>
          <td><input type="text" id="company" name="company" required></td>
        </tr>
        <tr>
          <td><label for="Address 1">Address 1:*</label></td>
          <td><input type="text" id="address1" name="address1" required></td>
        </tr>
        <tr>
          <td><label for="Address 2">Address 2:</label></td>
          <td><input type="text" id="address2" name="address2" required></td>
        </tr>
        <tr>
          <td><label for="City">City:*</label></td>
          <td><input type="text" id="city" name="city" required></td>
        </tr>
        <tr>
          <td><label for="state">State:*</label><br></td>
          <td><select id="state" name="state">
              <option value="">-- Select a State --</option>
              <option value="W.DC">W.DC</option>
              <option value="LA">LA</option>
              <option value="Las V.">Las V.</option>
              <option value="Hollywood">Hollywood</option>
            </select></td>
        </tr>
        <tr>
          <td><label for="Zip Code">Zip Code:*</label></td>
          <td><input type="text" id="zipcode" name="zipcode" required></td>
        </tr>
        <tr>
          <td><label for="country">Country:*</label><br></td>
          <td><select id="country" name="country">
              <option value="">-- Select a Country --</option>
              <option value="USA">USA</option>
              <option value="UK">UK</option>
              <option value="India">India</option>
              <option value="Bangladesh">Bangladesh</option>
            </select></td>
        </tr>
        <tr>
          <td><label for="Phone">Phone:</label></td>
          <td><input type="text" id="phone" name="phone" required></td>
        </tr>
        <tr>
          <td><label for="Fax">Fax:</label></td>
          <td><input type="text" id="fax" name="fax" required></td>
        </tr>
        <tr>
          <td><label for="email">Email:*</label></td>
          <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>
          <td><label>Donation Amount:*</label></td>
          <td>
            <label><input type="radio" name="gender" value="none"> None</label>
            <label><input type="radio" name="gender" value="$50"> $50</label>
            <label><input type="radio" name="gender" value="$75"> $75</label>
            <label><input type="radio" name="gender" value="$100"> $100</label>
            <label><input type="radio" name="gender" value="$250"> $250</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </td>
        </tr>
        <tr>
          <td>
            (Check a button or type in your amount)
          </td>
            <td><b>Other Amount $ </b><input type="text"></td>
        </tr>
        <tr>
            <td><b>Recurring Donation</b></td>
            <td>
                <input type="checkbox"> I am interested in giving on a regular basis
            </td>
        </tr>
            <td>(Check if yes)</td>
            <td>
            Monthly Credit Card $
            <input type="text" size="10">

            For
            <input type="text" size="5">

            Months
            </td>
        </tr>

      </table>
    <!--</fieldset>-->
  </form>

  <!--<hr>-->

  <footer>
    <p><small>&copy; 2026 RAJ SR</small></p>
  </footer>

</body>

</html>
