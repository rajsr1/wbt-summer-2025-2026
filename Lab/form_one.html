<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>form one — RAJ SR</title>

<body>

  <h1>GET STARTED</h1>
  <p>* - Create your workspace</p>

  <form>

    <div class="S">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
    </div>

    <div class="S">
      <label for="phonenumber">Phone Number</label>
      <input type="number" id="phonenumber" name="phonenumber" placeholder="5551234567" required>
    </div>

    <div class="S">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" placeholder="25/06/2026" required>
    </div>

    <div class="S">
      <label for="email">Work Email</label>
      <input type="email" id="email" name="email" placeholder="jane@company.com" required>
    </div>

    <div class="S">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters">
    </div>

    <div class="C">
      <input type="checkbox" id="updates">
      <label for="updates">Email me product updates and tips</label>
    </div>
    <div class="C">
      <input type="checkbox" id="terms">
      <label for="terms">I agree to the Terms & Privacy Policy</label>
    </div>

    <div class="B">
      <button type="submit">Create workspace</button>
      <button type="reset">Reset</button>
    </div>

  </form>

  <hr>


</body>

</html>
