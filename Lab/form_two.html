<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>form Two — RAJ SR</title>
</head>

<body>

    <h1>Registration</h1>
    <p>* - Please complete all fields below</p>

    <form>

        <div class="S">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
        </div>

        <div class="S">
            <label for="postalcode">Postal Code</label>
            <input type="number" id="postalcode" name="phonenumber" placeholder="10001" required>
        </div>

        <div class="S">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" placeholder="25/06/2026" required>
        </div>

        <div class="S">
            <label for="email">Email </label>
            <input type="email" id="email" name="email" placeholder="jane@company.com" required>
        </div>

        <div class="S">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
        </div>

        <div class="C">
            <label>Country</label>
            <select>
                <option>Select a country...</option>
                <option>USA</option>
                <option>UK</option>
                <option>India</option>
                <option>Bangladesh</option>
            </select>
        </div>

        <div class="B">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

    <hr>


</body>

</html>
